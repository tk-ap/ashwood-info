  <body>
    <main class="shell" aria-labelledby="site-title">
      <header class="masthead">

      <section class="intro">
        <p class="eyebrow">Tahlia Ashwood Peart</p>
        <h1 id="site-title">I follow ideas<br /><a class="iridescent-word" href="/portfolio/" aria-label="Feeling curious? Explore a random ASHWOOD section">wherever</a> they go.</h1>
        <p class="home-identity">Out of One, Many <span class="iridescent-word">Becomings</span>.</p>
      </section>

      <section class="principles-field" aria-label="ASHWOOD working principles">
        <p class="principles-field__hint">Explore the field to find the points of intrigue.</p>
        <button class="principle-hotspot principle-hotspot--friction" type="button" aria-label="SIGNAL: I prioritize what matters most, anticipate risks, and help leaders move faster with better information."><span class="principle-hotspot__label">SIGNAL</span><span class="principle-hotspot__quote">I prioritize what matters most, anticipate risks, and help leaders move faster with better information.</span></button>
        <button class="principle-hotspot principle-hotspot--friction" type="button" aria-label="FRICTION: I notice the small things that make a process harder than it needs to be — then I usually can't leave them alone."><span class="principle-hotspot__label">FRICTION</span><span class="principle-hotspot__quote">I notice the small things that make a process harder than it needs to be — then I usually can't leave them alone.</span></button>
        <button class="principle-hotspot principle-hotspot--translation" type="button" aria-label="TRANSLATION: I turn complexity into something people can actually understand, decide from, and act on."><span class="principle-hotspot__label">TRANSLATION</span><span class="principle-hotspot__quote">I turn complexity into something people can actually understand, decide from, and act on.</span></button>
        <button class="principle-hotspot principle-hotspot--systems" type="button" aria-label="SYSTEMS: I look for the structure underneath the problem. Fixing the symptom is rarely interesting enough."><span class="principle-hotspot__label">SYSTEMS</span><span class="principle-hotspot__quote">I look for the structure underneath the problem. Fixing the symptom is rarely interesting enough.</span></button>
        <button class="principle-hotspot principle-hotspot--resilience" type="button" aria-label="RESILIENCE: I think about what happens when the plan meets reality — because that's where the interesting problems usually begin."><span class="principle-hotspot__label">RESILIENCE</span><span class="principle-hotspot__quote">I think about what happens when the plan meets reality — because that's where the interesting problems usually begin.</span></button>
        <button class="principle-hotspot principle-hotspot--range" type="button" aria-label="RANGE: I don't fit neatly into one lane. That's less a branding problem than a useful advantage."><span class="principle-hotspot__label">RANGE</span><span class="principle-hotspot__quote">I don't fit neatly into one lane. That's less a branding problem than a useful advantage.</span></button>

      </nav>
    </main>
    <script>
      (() => {
        const field = document.querySelector('.principles-field');
        if (!field) return;
        const hotspots = [...field.querySelectorAll('.principle-hotspot')];
        const surface = field.closest('.shell') || document.body;
        const protectedSelectors = ['.masthead', '.intro', '.future-nav'];
        const close = () => {
          hotspots.forEach((hotspot) => hotspot.classList.remove('is-revealed', 'is-near'));
          field.classList.remove('is-pinned');
        };
        const intersects = (a, b, padding = 18) =>
          a.left < b.right + padding && a.right > b.left - padding &&
          a.top < b.bottom + padding && a.bottom > b.top - padding;
        const protectedRects = () => protectedSelectors
          .flatMap((selector) => [...surface.querySelectorAll(selector)])
          .map((el) => el.getBoundingClientRect());
        const randomize = () => {
          const rect = field.getBoundingClientRect();
          const protectedAreas = protectedRects();
          const placed = [];
          const gap = 34;
          const candidates = [];
          for (let i = 0; i < 160; i += 1) {
            candidates.push({ x: 4 + Math.random() * 88, y: 4 + Math.random() * 88, score: Math.random() });
          }
          hotspots.forEach((hotspot) => {
            let best = null;
            candidates.sort((a, b) => a.score - b.score);
            for (const pos of candidates) {
              hotspot.style.left = pos.x + '%';
              hotspot.style.top = pos.y + '%';
              hotspot.style.right = 'auto';
              hotspot.style.bottom = 'auto';
              const candidate = hotspot.getBoundingClientRect();
              const valid = candidate.left >= rect.left + 10 &&
                candidate.top >= rect.top + 10 &&
                candidate.right <= rect.right - 10 &&
                candidate.bottom <= rect.bottom - 10 &&
                !protectedAreas.some((area) => intersects(candidate, area, 28)) &&
                !placed.some((area) => intersects(candidate, area, gap));
              if (valid) { best = candidate; break; }
            }
            if (!best) {
              hotspot.style.left = (8 + Math.random() * 80) + '%';
              hotspot.style.top = (8 + Math.random() * 80) + '%';
              best = hotspot.getBoundingClientRect();
            }
            placed.push(best);
          });
        };
        const point = (clientX, clientY) => {
          const rect = field.getBoundingClientRect();
          field.style.setProperty('--field-x', Math.max(0, Math.min(100, (clientX - rect.left) / rect.width * 100)) + '%');
          field.style.setProperty('--field-y', Math.max(0, Math.min(100, (clientY - rect.top) / rect.height * 100)) + '%');
          const nearest = hotspots.map((hotspot) => {
            const r = hotspot.getBoundingClientRect();
            return { hotspot, distance: Math.hypot((r.left + r.width / 2) - clientX, (r.top + 34) - clientY) };
          }).sort((a, b) => a.distance - b.distance)[0];
          hotspots.forEach((hotspot) => hotspot.classList.toggle('is-near', hotspot === nearest.hotspot && nearest.distance < 155));
          field.classList.add('is-exploring');
        };
        randomize();
        surface.addEventListener('pointermove', (event) => point(event.clientX, event.clientY), { passive: true });
        surface.addEventListener('pointerenter', (event) => point(event.clientX, event.clientY), { passive: true });
        window.addEventListener('resize', randomize, { passive: true });
        field.addEventListener('pointerleave', () => {
          field.classList.remove('is-exploring');
          hotspots.forEach((hotspot) => { if (!hotspot.classList.contains('is-revealed')) hotspot.classList.remove('is-near'); });
        });
        hotspots.forEach((hotspot) => hotspot.addEventListener('click', (event) => {
          event.stopPropagation();
          const wasRevealed = hotspot.classList.contains('is-revealed');
          hotspots.forEach((item) => item.classList.remove('is-revealed', 'is-near'));
          if (!wasRevealed) {
            hotspot.classList.add('is-revealed');
            field.classList.add('is-pinned');
          } else {
            field.classList.remove('is-pinned');
          }
        }));
        document.addEventListener('click', (event) => { if (!field.contains(event.target) && !event.target.closest('.principle-hotspot')) close(); });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
      })();
    </script> </body>
