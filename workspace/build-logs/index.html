<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Build Logs — ASHWOOD Workspace</title><link rel="stylesheet" href="/ashwood-core.css"><link rel="stylesheet" href="/workspace/elitk-page.css?v=20260920-inlineelitk1"><style>body{margin:0;background:#11110f;color:#f1eee6;font:16px/1.65 system-ui}main{max-width:850px;margin:auto;padding:32px 22px}a{color:inherit}h1{font-size:clamp(36px,7vw,64px);line-height:1.1}input{width:100%;box-sizing:border-box;padding:14px;font:inherit}article{border-top:1px solid #777;padding:24px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}summary{cursor:pointer;padding:12px 0}button{padding:12px;font:inherit}</style></head><body data-elitk-page="build-logs"><main><a href="/workspace/">← Workspace</a> · <a href="/workspace/dispatch-studio/">Dispatch Studio →</a><h1>Build logs</h1><p>Decisions, failures, evidence, and open questions. Historical reports retain what was known at the time; saving a log does not verify its claims.</p><label>Find a date, product, or decision<input id="search" type="search"></label><p id="status" role="status">Loading private records…</p><div id="logs"></div></main><script type="module">
const status=document.querySelector('#status'), list=document.querySelector('#logs'), search=document.querySelector('#search');
let logs=[];
function render(){list.replaceChildren();const term=search.value.toLowerCase();for(const log of logs.filter(x=>(x.title+' '+x.notes).toLowerCase().includes(term))){const article=document.createElement('article'),details=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('pre');summary.textContent=log.title+' · Reported history';body.textContent=log.notes||'';details.append(summary,body);article.append(details);list.append(article);}status.textContent=logs.length+' saved logs';}
search.addEventListener('input',render);
try{const response=await fetch('/api/workspace-state?view=build_logs',{credentials:'same-origin',cache:'no-store'});if(response.status===401){status.textContent='Sign in through Workspace to read your logs.';}else{if(!response.ok)throw new Error('load');const data=await response.json();logs=data.logs;render();}}catch{status.textContent='Could not load logs. Reload to retry.';}
</script><script type="module" src="/workspace/elitk-page.mjs?v=20260920-inlineelitk1"></script></body></html>
