name: verify here.now Gravity baseline

on:
  push:
    branches:
      - ops/herenow-gravity-sandbox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out verification code
        uses: actions/checkout@v4

      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise and capture baseline
        run: node scripts/herenow-visual-check.mjs

      - name: Upload baseline screenshots
        uses: actions/upload-artifact@v4
        with:
          name: herenow-gravity-baseline-screenshots
          path: |
            herenow-desktop.png
            herenow-mobile.png
          if-no-files-found: error
          retention-days: 7
