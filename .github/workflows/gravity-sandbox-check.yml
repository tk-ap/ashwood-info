name: verify Gravity sandbox

on:
  push:
    branches:
      - ops/herenow-gravity-sandbox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium webkit
      - name: Start static sandbox server
        run: |
          npx -y http-server . -p 4173 -c-1 > /tmp/gravity-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gravity-http.log
          exit 1
      - name: Enforce scene-mounting contract
        run: node --test tests/gravity-motion-contract.test.mjs
      - name: Exercise Gravity renderer
        run: node scripts/gravity-sandbox-check.mjs
      - name: Preserve proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-sandbox-proof
          path: gravity-*.png
          if-no-files-found: ignore
          retention-days: 7

  deploy-herenow:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERENOW_TARGET_SLUG: mighty-yoga-pgph
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require authenticated here.now secret
        run: |
          if [ -z "$HERENOW_API_KEY" ]; then
            echo "HERENOW_API_KEY status: NOT SET"
            exit 1
          fi
          echo "HERENOW_API_KEY status: SET"
      - name: Validate publisher syntax
        run: node --check scripts/herenow-publish-sandbox.mjs
      - name: Publish verified sandbox to here.now
        run: node scripts/herenow-publish-sandbox.mjs
      - name: Preserve publish result
        uses: actions/upload-artifact@v4
        with:
          name: herenow-gravity-permanent-result
          path: .sandbox/herenow-result.json
          if-no-files-found: error
          retention-days: 1
