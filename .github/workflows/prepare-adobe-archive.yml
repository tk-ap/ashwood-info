name: Prepare approved Adobe archive assets
on:
  push:
    branches: [feature/adobe-archive-stories]
    paths: [.github/workflows/prepare-adobe-archive.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Prepare reviewed source images and metadata-free delivery files
        run: |
          python - <<'PY'
          import io,json,pathlib,urllib.request
          from PIL import Image,ImageOps
          manifest=json.load(open('modeling/archive/photos.json'))
          root=pathlib.Path('assets/modeling/adobe-archive');root.mkdir(exist_ok=True)
          for p in manifest['records']:
              path=pathlib.Path(p['path'].lstrip('/'))
              if not path.exists():
                  assert p['sourceUrl'].startswith('https://cdn.myportfolio.com/03dd04c4-bb6b-4236-b8fb-0f46a591f405/')
                  raw=urllib.request.urlopen(p['sourceUrl'],timeout=90).read()
                  image=ImageOps.exif_transpose(Image.open(io.BytesIO(raw))).convert('RGB')
                  assert image.size==(p['width'],p['height'])
                  image.save(path,quality=95,subsampling=0)
              image=ImageOps.exif_transpose(Image.open(path)).convert('RGB')
              image.thumbnail((1440,1440))
              image.save(p['deliveryPath'].lstrip('/'),quality=88,method=6)
          PY
      - name: Save assets on review branch only
        run: |
          git config user.name 'ASHWOOD archive preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/modeling/adobe-archive
          git commit -m 'Import reviewed Adobe archive images and delivery assets'
          git push origin HEAD:feature/adobe-archive-stories
