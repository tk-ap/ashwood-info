name: Preview approved Adobe archive on canonical sandbox
on:
  push:
    branches: [feature/adobe-archive-stories]
    paths: [.github/workflows/preview-adobe-archive.yml]
permissions:
  contents: read
concurrency:
  group: ashwood-canonical-herenow-publish
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish only archive delta with current-version lease
        run: |
          python - <<'PY'
          import hashlib
          import mimetypes
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          
          SLUG = "mighty-yoga-pgph"
          ROOT = "https://here.now"
          API = f"{ROOT}/api/v1/publish/{SLUG}"
          CLIENT = "github-actions/ashwood-adobe-archive"
          KEY = os.environ.get("HERENOW_API_KEY", "")
          DRY_RUN = os.environ.get("ASHWOOD_PUBLISH_DRY_RUN", "").lower() == "true"
          if not KEY:
              raise SystemExit("Owner credential unavailable; no publish")
          
          def request(url, method="GET", data=None, headers=None):
              headers = dict(headers or {})
              headers.setdefault("X-HereNow-Client", CLIENT)
              if url.startswith(ROOT + "/api/"):
                  headers["Authorization"] = f"Bearer {KEY}"
              req = Request(url, data=data, headers=headers, method=method)
              try:
                  with urlopen(req, timeout=60) as response:
                      return response.read(), response.headers
              except HTTPError as error:
                  # Do not print protected body or presigned URLs.
                  raise RuntimeError(f"here.now {method} failed HTTP {error.code}") from None
          
          def getjson(url, method="GET", obj=None):
              payload = json.dumps(obj).encode("utf-8") if obj is not None else None
              raw, _ = request(url, method, payload, {"Content-Type": "application/json"})
              try:
                  return json.loads(raw)
              except ValueError:
                  raise RuntimeError(f"here.now {method} returned invalid JSON") from None
          
          def origin_safe(url):
              parsed = urlparse(url)
              return parsed.scheme == "https" and parsed.hostname == "here.now"
          
          state = getjson(API)
          base = state.get("currentVersionId")
          manifest = state.get("manifest")
          if not base or not isinstance(manifest,list) or len(manifest)>2400:
              raise RuntimeError("Invalid current provider manifest")
          by_path={i["path"]:i for i in manifest}
          if len(by_path)!=len(manifest) or "modeling/index.html" not in by_path:
              raise RuntimeError("Expected modeling route absent; no publish")
          raw,_=request(API+"/files/modeling/index.html")
          if hashlib.sha256(raw).hexdigest()!=by_path["modeling/index.html"]["hash"]:
              raise RuntimeError("Owner modeling bytes differ from manifest")
          current=raw.decode("utf-8")
          local=Path("modeling/index.html").read_text()
          def archive_section(html):
              match=re.search(r'<section id="work"[\s\S]*?</section>',html)
              if not match:raise RuntimeError("Archive section boundary absent")
              return match
          old=archive_section(current);new=archive_section(local)
          # Only replace the agreed archive section; preserve all other live modeling content.
          current=current[:old.start()]+new[0]+current[old.end():]
          if '/modeling/archive/archive.css' not in current:
              current=current.replace('</head>','<link rel="stylesheet" href="/modeling/archive/archive.css?v=20261110" /></head>')
          updates={"modeling/index.html":current.encode()}
          for file in Path('modeling/archive').rglob('*'):
              if file.is_file():updates[str(file)]=file.read_bytes()
          records=json.loads(Path('modeling/archive/photos.json').read_text())['records']
          for p in records:
              for key in ['path','deliveryPath']:
                  path=p[key].lstrip('/')
                  if key=='deliveryPath' or path.startswith('assets/modeling/adobe-archive/') or path not in by_path:
                      updates[path]=Path(path).read_bytes()
          # Preserve shared sandbox resources; add dependencies only when absent.
          for path in ['portfolio/portfolio.css','creative-shell.css','portfolio-lightbox.js','theme.js','favicon.svg']:
              if path not in by_path:updates[path]=Path(path).read_bytes()
          updates={p:b for p,b in updates.items() if p not in by_path or hashlib.sha256(b).hexdigest()!=by_path[p]['hash']}
          new_manifest=[]
          for i in manifest:
              if i['path'] not in updates:
                  new_manifest.append({k:i[k] for k in ['path','size','contentType','hash']})
          for p,b in updates.items():
              ctype=mimetypes.guess_type(p)[0] or 'application/octet-stream'
              new_manifest.append({'path':p,'size':len(b),'contentType':ctype,'hash':hashlib.sha256(b).hexdigest()})
          original_hashes={i['path']:i['hash'] for i in manifest if i['path'] not in updates}
          if original_hashes!={i['path']:i['hash'] for i in new_manifest if i['path'] not in updates}:
              raise RuntimeError("Unrelated files changed")
          print(f"PREFLIGHT_OK base={base} retained={len(original_hashes)} changed={len(updates)}")
          if DRY_RUN:
              sys.exit(0)
          if not updates:
              print('ALREADY_CURRENT');sys.exit(0)
          payload={"baseVersionId":base,"files":new_manifest}
          result=getjson(API,"PUT",payload)
          upload=result.get("upload") or {}
          uploads=upload.get("uploads") or []
          skipped=set(upload.get("skipped") or [])
          expected_uploads=set(updates)
          if set(x["path"] for x in uploads) != expected_uploads:
              raise RuntimeError("Unexpected upload plan; refusing to finalize")
          if any(path not in skipped for path in original_hashes):
              raise RuntimeError("Unchanged owner files not listed as skipped; refusing to finalize")
          for transfer in uploads:
              path=transfer["path"]
              url=transfer.get("url")
              host=urlparse(url).hostname if isinstance(url,str) else ""
              if not host or not host.endswith(".r2.cloudflarestorage.com") or not url.startswith("https://"):
                  raise RuntimeError("Unexpected storage upload destination; refusing publish")
              transfer_headers=transfer.get("headers") or {}
              transfer_headers.pop("Authorization",None)
              request(url, "PUT", updates[path], transfer_headers)
          finalize_url=upload.get("finalizeUrl")
          if not isinstance(finalize_url,str) or not origin_safe(finalize_url):
              raise RuntimeError("Unexpected finalize endpoint")
          version=upload.get("versionId")
          if not version:
              raise RuntimeError("Provider did not supply a staged version")
          final=getjson(finalize_url,"POST",{"versionId":version})
          if not final.get("success") or final.get("slug") != SLUG:
              raise RuntimeError("Finalize did not attest success")
          if final.get("previousVersionId") not in (base,None):
              raise RuntimeError("Unexpected release predecessor")
          latest=getjson(API)
          live_version=latest.get("currentVersionId")
          if live_version != final.get("currentVersionId"):
              raise RuntimeError("Provider version readback mismatch")
          live_manifest = {item["path"]:item["hash"] for item in latest.get("manifest",[])}
          if live_manifest != {item["path"]:item["hash"] for item in new_manifest}:
              raise RuntimeError("Post-publish manifest differs; investigate immediately")
          # Verify changed bytes by provider owner read, independent of SPA path routing.
          for path in updates:
              restored,_=request(API+"/files/"+path)
              if hashlib.sha256(restored).hexdigest()!=hashlib.sha256(updates[path]).hexdigest():
                  raise RuntimeError(f"Published file verification failed: {path}")
          print(f"PUBLISHED_AND_VERIFIED slug={SLUG} old={base} current={live_version} total_files={len(new_manifest)}")
          Path('archive-preview-receipt.json').write_text(json.dumps({'base':base,'version':live_version,'source_sha':os.environ.get('GITHUB_SHA'),'preserved_count':len(original_hashes),'updated_paths':sorted(updates)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adobe-archive-preview-receipt
          path: archive-preview-receipt.json
          if-no-files-found: error
