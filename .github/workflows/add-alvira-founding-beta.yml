name: Add ALVIRA Founding Beta Journal invitation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-alvira-founding-beta.yml

permissions:
  contents: write

jobs:
  patch-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Founding Beta invitation
        env:
          PATCH_SCRIPT_B64:  QeKAlG5vdCBqdXN0IHdhdGNoIHRoZSBidWlsZC4gVGhlIHF1ZXN0aW9uIGlzIHNpbXBsZTogZG9lcyBtYWludGFpbmVkIGNvbnRleHQgbWFrZSB         run: |
          echo "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch_journal.py
          python /tmp/patch_journal.py
      - name: Commit Journal invitation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/index.html
          git commit -m "add ALVIRA Founding Beta invitation to Build Journal"
          git push origin HEAD:main
