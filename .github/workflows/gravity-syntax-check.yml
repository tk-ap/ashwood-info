name: gravity syntax check
on:
  push:
    branches: [ops/herenow-gravity-sandbox]
    paths:
      - "gravity-renderer.js"
      - "gravity-sandbox.js"
      - "gravity-physical.js"
      - "tests/gravity-physical.test.mjs"
      - "scripts/herenow-publish-sandbox.mjs"
      - ".github/workflows/gravity-syntax-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          node --check gravity-renderer.js
          node --check gravity-sandbox.js
          node --check gravity-physical.js
          node --test tests/gravity-physical.test.mjs
          node --check scripts/herenow-publish-sandbox.mjs
