name: Content Intelligence browser proof

on:
  pull_request:
    paths:
      - "workspace/app.js"
      - "workspace/index.html"
      - "workspace/content-intelligence.mjs"
      - "workspace/content-studio.css"
      - "api/workspace-state.mjs"
      - "scripts/content-intelligence-check.mjs"
      - ".github/workflows/content-intelligence-check.yml"

permissions:
  contents: read

jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4174 >/tmp/ashwood-content-http.log 2>&1 &
          echo $! > /tmp/ashwood-content-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4174/workspace/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: node scripts/content-intelligence-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-intelligence-browser-proof
          path: .sandbox/content-intelligence-proof
          if-no-files-found: warn
          retention-days: 2
