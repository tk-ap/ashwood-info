name: ASHWOOD Universe sandbox preview

# This one-time branch trigger is required because GitHub only exposes manual
# dispatch for workflows already present on the default branch. It is restored
# to manual-only immediately after the sandbox receipt is captured.
on:
  push:
    branches:
      - codex/ashwood-editorial-universe-20261116
    paths:
      - '.github/workflows/ashwood-universe-sandbox.yml'

permissions:
  contents: read

concurrency:
  group: ashwood-here-now-mighty-yoga-pgph
  cancel-in-progress: false

jobs:
  publish-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
    steps:
      - name: Check out this reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check publisher syntax and source contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish-universe-sandbox.py
          grep -Fq 'prefers-reduced-motion' universe/universe.css
          grep -Fq 'href: null' universe/content.mjs
      - name: Establish a protected no-write provider plan
        env:
          ASHWOOD_PUBLISH_DRY_RUN: "true"
        run: |
          set -euo pipefail
          python3 scripts/publish-universe-sandbox.py
      - name: Publish only the public Universe layer in place
        env:
          ASHWOOD_PUBLISH_DRY_RUN: "false"
        run: |
          set -euo pipefail
          python3 scripts/publish-universe-sandbox.py
